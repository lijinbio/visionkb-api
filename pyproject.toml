[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "visionkb-api"
version = "0.1.4"
description = "Read-only FastAPI service over a VisionKB knowledge-graph release (Neo4j + Parquet summaries), with a proposals queue"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Rui Chen Lab, University of California, Irvine" }]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: FastAPI",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "fastapi>=0.162,<0.170",
  "uvicorn>=0.54",
  "pydantic>=2.14",
  "duckdb>=2.0,<2.1",
  "neo4j>=6.4,<7",
  "psycopg[binary]>=3.3,<4",
  "httpx2>=2.16",
]

[project.urls]
Repository = "https://github.com/lijinbio/visionkb-api"

[project.scripts]
visionkb-api = "visionkb_api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
visionkb_api = ["data/*.json"]

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.16", "pre-commit>=4"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["E501", "S101", "S603", "S607", "S310"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"scripts/**" = ["S"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Security"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["integration: needs live Neo4j and PostgreSQL loaded with the fixture release (VISIONKB_IT=1)"]
